# Netlify deploy settings. Netlify detects Next.js and uses its OpenNext adapter automatically.
[build]
  # Apply any pending database migrations, then build. DATABASE_URL must be set in Netlify.
  command = "npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
