# Netlify deploy settings. Netlify detects Next.js and uses its OpenNext adapter automatically.
[build]
  # Apply pending database migrations (with retries while Neon wakes up), then build.
  # DATABASE_URL must be set in Netlify.
  command = "bash scripts/migrate-deploy.sh && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
