<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor: add, reorder, restyle</title>
<link rel="stylesheet" href="base.css">
<style>
  body { width: 1280px; height: 800px; position: relative; background: var(--paper); }
  .side { position: absolute; left: 0; top: 0; bottom: 0; width: 220px; border-right: 1px solid var(--line); background: #f6f2ea; padding: 22px 14px; }
  .logo { display: flex; align-items: center; gap: 10px; font: 700 20px "Bricolage Grotesque"; margin: 0 6px 26px; }
  .logo i { width: 30px; height: 30px; border-radius: 9px; background: var(--plum); display: grid; place-items: center; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font: 500 14px Inter; color: var(--muted); margin-bottom: 2px; }
  .nav.on { background: var(--plum-soft); color: var(--plum); font-weight: 600; }
  .nav b { width: 16px; height: 16px; border-radius: 4px; border: 2px solid currentColor; opacity: .7; }
  .top { position: absolute; left: 220px; right: 0; top: 0; height: 64px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
  .url { font: 500 14px Inter; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; }
  .saved { font: 600 13px Inter; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .saved .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  h1 { position: absolute; left: 252px; top: 88px; font-size: 26px; }
  .tabs { position: absolute; left: 252px; top: 132px; display: flex; gap: 4px; background: #efe9de; padding: 4px; border-radius: 12px; font: 500 13px Inter; }
  .tabs span { padding: 6px 14px; border-radius: 9px; color: var(--muted); } .tabs .on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .addbtn { position: absolute; left: 676px; top: 130px; height: 36px; padding: 0 16px; border-radius: 10px; background: var(--plum); color: #fff; font: 600 13.5px Inter; display: flex; align-items: center; gap: 6px; }
  .list { position: absolute; left: 252px; top: 184px; width: 560px; height: 340px; }
  .block { position: absolute; left: 0; right: 0; height: 66px; border-radius: 14px; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 16px; transform-origin: center; }
  .handle { width: 10px; display: grid; grid-template-columns: 4px 4px; gap: 3px 2px; } .handle i { width: 4px; height: 4px; border-radius: 50%; background: #c9c2b4; }
  .bico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
  .btitle { font: 600 14.5px Inter; } .burl { font: 400 12.5px Inter; color: var(--muted); margin-top: 2px; }
  .caret { display: inline-block; width: 2px; height: 16px; background: var(--plum); vertical-align: -3px; margin-left: 1px; }
  .switch { margin-left: auto; width: 36px; height: 20px; border-radius: 999px; background: var(--sage); position: relative; } .switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .theme { position: absolute; left: 252px; top: 548px; width: 560px; height: 210px; border-radius: 16px; background: #fff; border: 1px solid var(--line); padding: 20px; }
  .theme h2 { font-size: 17px; } .theme p { font: 400 13px Inter; color: var(--muted); margin-top: 4px; }
  .swatches { display: flex; gap: 14px; margin-top: 18px; }
  .sw { width: 76px; height: 98px; border-radius: 14px; position: relative; border: 2px solid transparent; overflow: hidden; }
  .sw.sel { outline: 3px solid var(--plum); outline-offset: 2px; }
  .sw i { position: absolute; left: 12px; right: 12px; height: 9px; border-radius: 5px; }
  .swl { position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font: 500 11.5px Inter; color: var(--muted); }
  .phonewrap { position: absolute; left: 900px; top: 96px; width: 320px; height: 660px; border-radius: 44px; background: #1c1a24; padding: 10px; box-shadow: 0 30px 60px rgba(28,26,36,.25); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; }
  .layer { position: absolute; inset: 0; text-align: center; }
  .pav { width: 76px; height: 76px; border-radius: 50%; margin: 64px auto 12px; }
  .pname { font: 700 21px "Bricolage Grotesque"; } .pbio { font: 400 12.5px Inter; margin-top: 6px; opacity: .8; }
  .plinks { position: absolute; left: 20px; right: 20px; top: 222px; }
  .plink { position: absolute; left: 0; right: 0; height: 48px; border-radius: 14px; display: grid; place-items: center; font: 600 13.5px Inter; }
  .cursor { position: absolute; left: 0; top: 0; z-index: 90; width: 24px; height: 24px; }
  .toast { position: absolute; right: 32px; bottom: 26px; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font: 600 14px Inter; display: flex; gap: 10px; align-items: center; opacity: 0; }
  .intro { position: absolute; inset: 0; z-index: 100; background: var(--paper); animation: fadeout .5s ease-out both; }
  .cover { background: var(--paper); }
</style>
</head>
<body>
  <div class="side">
    <div class="logo"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M6 18c0-7 4-12 12-12M10 18c0-4 2-7 6-7"/></svg></i>Tendril</div>
    <div class="nav"><b></b>Overview</div><div class="nav on"><b></b>Editor</div><div class="nav"><b></b>Smart links</div><div class="nav"><b></b>Analytics</div><div class="nav"><b></b>Billing</div><div class="nav"><b></b>Settings</div>
  </div>
  <div class="top"><span class="url">tendril.link/juno.paints</span><span class="saved"><span class="dot" id="sdot"></span><span id="stext">All changes saved</span></span></div>
  <h1 class="display">Your page</h1>
  <div class="tabs"><span class="on">Blocks</span><span>Profile</span><span>Theme</span><span>SEO</span></div>
  <div class="addbtn" id="addbtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>Add link</div>
  <div class="list" id="list"></div>
  <div class="theme">
    <h2 class="display">Theme</h2><p>Pick a look. Your page updates as you click.</p>
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="phonewrap"><div class="screen" id="screen"></div></div>
  <div class="toast" id="toast"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7cc29c" stroke-width="3"><path d="m5 12 5 5L20 7"/></svg>Your page is live</div>
  <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2.5 19 13l-6.6 1.2L9 20.5z" fill="#1c1a24" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div class="intro"></div>
  <div class="cover"></div>
<script>
  const BLOCKS = {
    N: { title: "Join my newsletter", url: "buttondown.com/juno", color: "#fdeee8", stroke: "#f2643d" },
    A: { title: "Print shop: spring drop", url: "juno.studio/shop", color: "#ece8fb", stroke: "#5b3fd1" },
    B: { title: "Mural commissions", url: "juno.studio/murals", color: "#e5f0ea", stroke: "#4e8b6b" },
    C: { title: "Process videos", url: "youtube.com/@junopaints", color: "#fbf0d6", stroke: "#b8860b" },
  };
  const THEMES = [
    { name: "Dusk", bg: "linear-gradient(165deg,#4b33c4,#6a3fd0 45%,#c2477e)", text: "#fff", link: "rgba(255,255,255,.95)", linkText: "#1c1a24", av: "radial-gradient(circle at 30% 30%,#ffd2a8,#f2643d 45%,#8a2f62)" },
    { name: "Garden", bg: "linear-gradient(180deg,#f1f6ef,#dfeee4)", text: "#1f3a2c", link: "#fff", linkText: "#1f3a2c", border: "1.5px solid #9cc5ad", av: "radial-gradient(circle at 30% 30%,#d8f0e1,#4e8b6b 60%,#24503a)" },
    { name: "Midnight", bg: "radial-gradient(90% 60% at 50% 0%,#3a2f12,transparent 70%),#121018", text: "#f4f1ea", link: "#221f2c", linkText: "#f5d77a", border: "1px solid rgba(245,215,122,.35)", av: "radial-gradient(circle at 30% 30%,#fff1c2,#d9a425 50%,#5a3f08)" },
  ];
  const $ = (id) => document.getElementById(id);
  const icon = (b) => `<span class="bico" style="background:${b.color}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${b.stroke}" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></span>`;
  const handle = `<span class="handle">${"<i></i>".repeat(6)}</span>`;
  for (const k of "NABC") {
    const el = document.createElement("div");
    el.className = "block"; el.id = "b" + k;
    el.innerHTML = `${handle}${icon(BLOCKS[k])}<div><div class="btitle" id="t${k}">${BLOCKS[k].title}</div><div class="burl" id="u${k}">${BLOCKS[k].url}</div></div><span class="switch"></span>`;
    $("list").appendChild(el);
  }
  THEMES.forEach((th, i) => {
    const sw = document.createElement("div");
    sw.className = "sw"; sw.id = "sw" + i; sw.style.background = th.bg;
    sw.innerHTML = `<i style="top:38px;background:${th.link};border:${th.border || "none"}"></i><i style="top:54px;background:${th.link};border:${th.border || "none"}"></i><i style="top:70px;background:${th.link};border:${th.border || "none"}"></i><span class="swl"></span>`;
    $("swatches").appendChild(sw);
    const layer = document.createElement("div");
    layer.className = "layer"; layer.id = "L" + i; layer.style.background = th.bg; layer.style.color = th.text;
    layer.innerHTML = `<div class="pav" style="background:${th.av}"></div><div class="pname">Juno Alvarez</div><div class="pbio">Painter. Murals and tiny canvases.</div><div class="plinks">${[..."NABC"].map((k) => `<div class="plink" data-k="${k}" style="background:${th.link};color:${th.linkText};border:${th.border || "none"}">${BLOCKS[k].title}</div>`).join("")}</div>`;
    $("screen").appendChild(layer);
  });
  for (const extra of ["Ocean", "Paper", "Sunset"]) {
    const sw = document.createElement("div");
    sw.className = "sw";
    sw.style.background = { Ocean: "linear-gradient(180deg,#dcecf8,#a9cdea)", Paper: "#fbf8f2", Sunset: "linear-gradient(180deg,#ffd9c2,#f2643d)" }[extra];
    sw.style.border = "1px solid #e7e2d8";
    sw.innerHTML = `<i style="top:38px;background:#fff"></i><i style="top:54px;background:#fff"></i><i style="top:70px;background:#fff"></i>`;
    $("swatches").appendChild(sw);
  }

  const lerp = (a, b, x) => a + (b - a) * x;
  // Cursor path: [time, x, y, pressed]
  const PATH = [
    [0, 1100, 760, 0], [0.6, 1000, 620, 0], [1.0, 730, 148, 0], [1.08, 730, 148, 1], [1.2, 730, 148, 0],
    [2.9, 560, 420, 0], [3.4, 270, 445, 0], [3.5, 270, 445, 1], [4.7, 270, 293, 1], [4.8, 270, 293, 0],
    [5.6, 400, 640, 0], [6.2, 380, 656, 0], [6.3, 380, 656, 1], [6.4, 380, 656, 0],
    [7.6, 470, 656, 0], [8.1, 470, 656, 0], [8.2, 470, 656, 1], [8.3, 470, 656, 0], [9.6, 760, 720, 0], [12, 1100, 760, 0],
  ];
  function cursorAt(t) {
    for (let i = 1; i < PATH.length; i++) {
      const [t1, x1, y1] = PATH[i];
      const [t0, x0, y0, d0] = PATH[i - 1];
      if (t <= t1) { const k = ease((t - t0) / (t1 - t0 || 1)); return [lerp(x0, x1, k), lerp(y0, y1, k), d0]; }
    }
    return PATH[PATH.length - 1].slice(1);
  }

  window.SCENE = {
    duration: 12,
    update(t) {
      // 1. Add a block: the new one grows in at the top and its title is typed.
      const grow = prog(t, 1.1, 1.6);
      const typed = BLOCKS.N.title.slice(0, Math.floor(Math.max(0, (t - 1.5) / 1.1) * BLOCKS.N.title.length));
      $("tN").innerHTML = t < 1.5 ? '<span style="color:#a7a1b0">Link title</span>' : typed + (t < 2.8 ? '<span class="caret"></span>' : "");
      $("uN").textContent = t < 2.6 ? "https://" : BLOCKS.N.url;
      // 2. Drag "Process videos" (C) from slot 3 to slot 1.
      const drag = prog(t, 3.5, 4.7);
      const slot = (k) => {
        const base = { N: 0, A: 1, B: 2, C: 3 }[k];
        const withN = k === "N" ? 0 : base - 1 + grow; // others shift down while N grows
        if (k === "C") return lerp(withN, 1, drag);
        if (k === "A" || k === "B") return withN + (withN >= 1 - 1e-6 ? drag * 1 : 0) * (base >= 1 ? 1 : 0);
        return withN;
      };
      const step = 76;
      for (const k of "NABC") {
        const el = $("b" + k);
        const s = k === "N" ? 0 : slot(k);
        el.style.top = `${s * step}px`;
        el.style.opacity = k === "N" ? grow : 1;
        el.style.transform = k === "N" ? `scale(${0.96 + 0.04 * grow})` : k === "C" && t > 3.45 && t < 4.85 ? "scale(1.02) rotate(-0.6deg)" : "none";
        el.style.boxShadow = k === "C" && t > 3.45 && t < 4.85 ? "0 18px 36px rgba(28,26,36,.18)" : "none";
        el.style.zIndex = k === "C" ? 3 : 1;
        el.style.borderColor = k === "N" && t > 1.4 && t < 2.9 ? "#5b3fd1" : "";
      }
      // Phone preview follows the list (with a short delay, like a live preview).
      for (const layer of document.querySelectorAll(".layer")) {
        for (const pl of layer.querySelectorAll(".plink")) {
          const k = pl.dataset.k;
          const s = k === "N" ? 0 : slot(k);
          pl.style.top = `${s * 58}px`;
          pl.style.opacity = k === "N" ? prog(t, 1.4, 1.8) : 1;
          if (k === "N") pl.textContent = t < 1.5 ? "" : typed || " ";
        }
      }
      // 3. Theme changes.
      const th = t < 6.35 ? 0 : t < 8.25 ? 1 : 2;
      const a1 = prog(t, 6.35, 6.85), a2 = prog(t, 8.25, 8.75);
      $("L0").style.opacity = 1;
      $("L1").style.opacity = a1 * (1 - a2);
      $("L2").style.opacity = a2;
      $("L1").style.zIndex = 2; $("L2").style.zIndex = 3;
      for (let i = 0; i < 3; i++) $("sw" + i).classList.toggle("sel", i === th);
      // Save status + toast.
      const saving = (t > 1.2 && t < 3.0) || (t > 3.5 && t < 5.2) || (t > 6.3 && t < 7.0) || (t > 8.2 && t < 9.0);
      $("stext").textContent = saving ? "Saving…" : "All changes saved";
      $("sdot").style.background = saving ? "#d9a425" : "#4e8b6b";
      $("toast").style.opacity = prog(t, 9.4, 9.8) * (1 - prog(t, 10.9, 11.3));
      $("toast").style.transform = `translateY(${(1 - prog(t, 9.4, 9.8)) * 12}px)`;
      $("addbtn").style.transform = t > 1.05 && t < 1.25 ? "scale(.95)" : "none";
      const [x, y, down] = cursorAt(t);
      $("cursor").style.transform = `translate(${x}px, ${y}px) scale(${down ? 0.85 : 1})`;
    },
  };
</script>
<script src="driver.js"></script>
</body>
</html>
